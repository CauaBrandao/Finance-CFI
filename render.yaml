services:
  - type: web
    name: cfi-finance-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SPRINGDOC_SWAGGER_ENABLED
        value: "false"
      - key: SPRINGDOC_API_DOCS_ENABLED
        value: "false"

