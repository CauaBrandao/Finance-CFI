# Perfil de produção — ativa com SPRING_PROFILES_ACTIVE=prod
server.port=${PORT:${SERVER_PORT:8080}}
server.error.include-stacktrace=never
server.error.include-message=never

# Em produção, bloqueia origens locais (localhost / 127.0.0.1) e aceita apenas CORS_ALLOWED_ORIGINS
cors.allow-local-dev=false
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Política de Swagger em produção: desabilitado por padrão; habilite explicitamente para demonstração se necessário
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_ENABLED:false}

