spring.application.name=cfi-finance-backend
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/api
server.error.include-stacktrace=never
server.error.include-message=never

# Integração com Google Gemini
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
gemini.timeout.seconds=35
gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models

# Configuração de CORS (desenvolvimento local habilitado por padrão)
cors.allow-local-dev=${CORS_ALLOW_LOCAL_DEV:true}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Documentação Swagger / OpenAPI
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Logs estruturados e seguros (sem expor payloads sensíveis)
logging.level.com.cfi.finance=INFO
logging.level.org.springframework.web=INFO
